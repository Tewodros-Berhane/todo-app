name: Evolune Temp Build

on:
  push:
    branches: [ "evolune-build-temp" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: evolune-build-temp
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct source
        run: |
          cat evolune-payload/payload0 evolune-payload/payload1 evolune-payload/payload2 | base64 -d > /tmp/Evolune-source.zip
          mkdir -p /tmp/evolune
          unzip -q /tmp/Evolune-source.zip -d /tmp/evolune
          cp evolune-payload/build.gradle.kts /tmp/evolune/Evolune/app/build.gradle.kts
      - name: Patch source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/evolune/Evolune/app/src/main/java/com/evolune/app/MainActivity.kt')
          lines=p.read_text().splitlines()
          for idx in sorted([310,358,407], reverse=True):
              if idx <= len(lines) and lines[idx-1].strip() == '}':
                  lines.pop(idx-1)
          s='\n'.join(lines)+'\n'
          s=s.replace('@Composable\nprivate fun AppTopBar', '@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nprivate fun AppTopBar')
          p.write_text(s)
          p=Path('/tmp/evolune/Evolune/app/src/main/java/com/evolune/app/Storage.kt')
          s=p.read_text()
          s=s.replace('arrayOf(q.xpReward, it)) }', 'arrayOf<Any?>(q.xpReward.toLong(), it)) }')
          s=s.replace('arrayOf(delta, it)) }', 'arrayOf<Any?>(delta.toLong(), it)) }')
          p.write_text(s)
          PY
      - name: Verify offline contract
        working-directory: /tmp/evolune/Evolune
        run: |
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Unit tests
        working-directory: /tmp/evolune/Evolune
        run: gradle testDebugUnitTest --stacktrace
      - name: Lint
        working-directory: /tmp/evolune/Evolune
        run: gradle lintDebug --stacktrace
      - name: Build installable APK
        working-directory: /tmp/evolune/Evolune
        run: gradle assembleDebug --stacktrace
      - name: Collect APK
        run: cp /tmp/evolune/Evolune/app/build/outputs/apk/debug/app-debug.apk Evolune-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Evolune-APK
          path: Evolune-debug.apk
          if-no-files-found: error
          retention-days: 7
